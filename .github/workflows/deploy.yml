name: Deploy to Firebase Hosting

# Deploys the frontend whenever code lands on main.
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      # .env is gitignored, so CI builds with empty VITE_FIREBASE_* vars unless we
      # inject them here from GitHub secrets. Without them, Firebase init throws
      # auth/invalid-api-key at runtime and the app renders a blank page.
      - name: Create frontend .env from secrets
        run: |
          cat > frontend/.env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

      # firebase.json lives at the repo root; the hosting "public" dir is frontend/dist.
      # firebase-tools >=15.22.3 includes a fix for the Node 24.17.0 googleapis bug.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@15.22.3 deploy --only hosting --project binge-buddies-17abf --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
